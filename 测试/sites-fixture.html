  <pre id="result"></pre>
  <script src="../content.js"></script>
  <script>
    window.submitAttempts = 0;
    window.addEventListener('error', function (event) {
      document.querySelector('#result').textContent = JSON.stringify({ error: String(event.message), stack: String(event.error && event.error.stack || '') });
    });
    document.querySelector('#sites-fixture').addEventListener('submit', function (event) {
      event.preventDefault();
      window.submitAttempts += 1;
    });
    var profile = {
      basic: {
        name: '示例姓名', gender: '男', birth_date: '2001-06-03', phone: '13800138000',
        email: 'example@example.com', current_residence: '示例城市', place_of_origin: '示例省份',
        political_status: '共青团员', ethnicity: '汉族', marital_status: '未婚',
        native_place: '示例省份', household_registration: '示例省份', wechat: '13800138000',
        qq: '123456', id_type: '身份证', has_children: '无', height: '178', weight: '75',
        work_start_date: '2023-07', work_years: '3年',
        phone_code: '+86', emergency_contact: '示例联系人', emergency_phone: '13800138001',
        mailing_address: '示例地址', age: '25'
      },
      intention: {
        target_role: '工艺工程师', city: '示例城市', industry: '电子半导体',
        salary: '8000', employment_type: '全职', available_date: '2027-07',
        interview_site: '示例城市'
      },
      education: [{
        level: '硕士', school: '示例大学', major: '电子信息', major_category: '电子信息',
        end_date: '2027-06', start_date: '2024-09', study_mode: '全日制',
        admission_type: '统招', graduate_type: '应届', college: '示例学院',
        degree_name: '工学硕士', major_rank: '前10%', gpa: '3.8',
        english_level: '大学英语六级', english_score: '528', advisor: '示例导师',
        research_direction: '示例方向', second_major: '示例辅修', thesis_title: '示例论文'
      }],
      employment: [{ employer: '示例公司', role: '电气工程师', start_date: '2023-07', end_date: '2024-08', location: '示例城市', employer_type: '国企', description: '示例工作内容' }],
      projects: [{ name: '示例项目', role: '负责人', organization: '示例单位', introduction: '示例介绍', outcomes: '示例成果' }],
      honors: [{ name: '示例奖学金', date: '2023-10', issuer: '示例大学' }],
      activities: [{ name: '示例活动', organization: '示例组织', role: '成员' }],
      campus_roles: [{ organization: '示例组织', role: '部长', gains: '示例收获' }],
      skills: [{ category: '英语', name: '大学英语六级', level: '熟练', evidence: '示例说明' }],
      additional: {
        hobbies: '摄影', specialty: '长跑', punishment: '无', academic_works: '无',
        patents: '无', law_violation: '否', applied_subsidiary: '否',
        relatives_in_company: '否', medical_history: '否', referral_code: ''
      },
      self_evaluation: '示例自我评价'
    };

    // One site at a time: hide the rest so scan() sees a single page's worth of columns and
    // starts each site with a fresh budget of profile values.
    var sites = Array.prototype.slice.call(document.querySelectorAll('fieldset[data-site]'));
    var cells = [];
    sites.forEach(function (current) {
      sites.forEach(function (other) { other.style.display = (other === current) ? '' : 'none'; });
      var found = ResumeContent.scan(profile, { siteKey: 'file://sites/' + current.getAttribute('data-site') });
      found.forEach(function (item) {
        // Keep the original candidate alongside the report fields: fill() reads proposedValue,
        // confidence and isNewField, so renaming them here would silently fill nothing.
        item.site = current.getAttribute('data-site');
        cells.push(item);
      });
    });
    sites.forEach(function (el) { el.style.display = ''; });

    // Fill everything that resolved, using the selectors collected above.
    var fillable = cells.filter(function (item) { return item.proposedValue && !item.isNewField; });
    ResumeContent.fill(fillable).then(function () {
      var values = {};
      document.querySelectorAll('#sites-fixture [name]').forEach(function (el) {
        values[el.getAttribute('name')] = el.value;
      });
      document.querySelector('#result').textContent = JSON.stringify({
        cells: cells, state: { values: values, submitAttempts: window.submitAttempts }
      });
    }, function (error) {
      // Surface the failure: an empty <pre> gives the smoke test nothing to report.
      document.querySelector('#result').textContent = JSON.stringify({ error: String(error && error.stack || error) });
    });
  </script>
