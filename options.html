<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的简历资料</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="nav-pane" aria-label="资料分类">
      <div class="nav-header">
        <button id="navToggle" class="nav-toggle" type="button" title="收起菜单" aria-label="收起菜单" aria-expanded="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M3.5 6h13M3.5 10h13M3.5 14h13"/>
          </svg>
        </button>
      </div>
      <div id="tabs" class="nav-items" role="tablist" aria-label="资料分类"></div>
      <div class="nav-footer">
        <p class="nav-footer-label">颜色</p>
        <div id="accentPicker" class="accent-row" role="radiogroup" aria-label="颜色"></div>
      </div>
    </nav>

    <div class="content">
      <header class="page-header">
        <div class="page-heading">
          <p class="eyebrow">我的资料</p>
          <h1>我的简历资料</h1>
          <p class="lead">资料只存在这台电脑的浏览器里，不会上传。空着的地方就保持空着，不会乱猜。</p>
        </div>
        <div class="actions">
          <button id="importButton" type="button">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 12.5V3.5"/><path d="M7 6.5 10 3.5l3 3"/><path d="M3.5 12.5v2.75a1.25 1.25 0 0 0 1.25 1.25h10.5a1.25 1.25 0 0 0 1.25-1.25V12.5"/>
            </svg>
            导入资料
          </button>
          <button id="exportButton" type="button">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 3.5v9"/><path d="M7 9.5 10 12.5l3-3"/><path d="M3.5 12.5v2.75a1.25 1.25 0 0 0 1.25 1.25h10.5a1.25 1.25 0 0 0 1.25-1.25V12.5"/>
            </svg>
            导出资料
          </button>
          <button id="saveButton" class="primary" type="button">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.25 3.5h8.4l3.1 3.1v9.9a.75.75 0 0 1-.75.75H4.25a.75.75 0 0 1-.75-.75V4.25a.75.75 0 0 1 .75-.75Z"/>
              <path d="M6.5 3.5v4h6v-4"/><path d="M6.5 16.5V12h7v4.5"/>
            </svg>
            保存资料
          </button>
          <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
        </div>
      </header>
      <section id="editor" class="editor"></section>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script src="profile-parser.js"></script>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
